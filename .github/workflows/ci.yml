name: Massar Rail Brain CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest
        
    - name: Verify Data Ingestion (Integration Test)
      run: |
        # Generate 100 records for Test Tenant to prove Ingestion/Indexing works
        python backend/generate_history.py --count 100 --operator CI_TEST_BOT --mode demo --upsert
        
    - name: Run Adversarial Physics Tests
      run: |
        # Prove SIL-4 Safety Logic
        pytest backend/tests/test_physics.py
